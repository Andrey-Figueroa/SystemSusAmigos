<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcas de vehículo | Configuración | Sus Amigos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tema único + estilos del módulo -->
    <link rel="stylesheet" href="../css/theme.css?v=2">
    <link rel="stylesheet" href="style.css?v=8">
    <!-- Configuración, layout compartido y verificación de sesión -->
    <script src="../js/config.js?v=13"></script>
    <script src="../js/layout.js?v=18"></script>
    <script src="../js/auth_guard.js?v=10"></script>
</head>
<body>
    <main class="cfg-content">
        <nav class="cfg-breadcrumb" aria-label="Ruta">
            <a href="index.html">Configuración</a>
            <i class="fa-solid fa-chevron-right" aria-hidden="true" style="font-size:10px"></i>
            <span aria-current="page">Marcas de vehículo</span>
        </nav>

        <header class="cfg-header">
            <div>
                <h1>Marcas de vehículo</h1>
                <p>Las marcas que salen en el autocompletado al registrar un vehículo en Local Comercial. Se guardan en MAYÚSCULAS.</p>
            </div>
            <button type="button" class="cfg-btn cfg-btn-primary" id="btn-nuevo">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> Nueva
            </button>
        </header>

        <div id="lista" aria-live="polite">
            <div class="cfg-sk"></div>
            <div class="cfg-sk"></div>
            <div class="cfg-sk"></div>
        </div>
    </main>

    <!-- Formulario crear / editar -->
    <dialog class="cfg-dialog" id="dialog-registro" aria-labelledby="dialog-titulo">
        <form id="form-registro" novalidate>
            <div class="cfg-dialog-head">
                <h2 id="dialog-titulo">Nueva marca</h2>
                <button type="button" class="cfg-icon-btn" id="btn-cerrar" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>

            <div class="cfg-dialog-body">
                <div class="cfg-field">
                    <label for="campo-nombre">Nombre <span class="cfg-req">*</span></label>
                    <input type="text" class="cfg-input" id="campo-nombre" maxlength="60" required autocomplete="off" placeholder="Ej.: TOYOTA" style="text-transform: uppercase;">
                </div>

                <label class="cfg-check">
                    <input type="checkbox" id="campo-activo" checked> Activo
                </label>

                <p class="cfg-form-error" id="form-error" role="alert"></p>
            </div>

            <div class="cfg-dialog-foot">
                <button type="button" class="cfg-btn cfg-btn-ghost" id="btn-cancelar">Cancelar</button>
                <button type="submit" class="cfg-btn cfg-btn-primary" id="btn-guardar">
                    <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar
                </button>
            </div>
        </form>
    </dialog>

    <div class="cfg-toasts" id="toasts" aria-live="polite"></div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script>
        window.CATALOGO = {"avisoEliminar":"Dejará de salir al registrar vehículos. Los vehículos ya registrados no cambian.","tabla":"marcas_vehiculo","singular":"marca","plural":"marcas","icono":"fa-copyright","ejemplos":"TOYOTA, HYUNDAI, YAMAHA","sql":"supabase/marcas_vehiculo.sql","sinModulos":true,"mayusculas":true,"femenino":true};
    </script>
    <script src="eliminar.js?v=1"></script>
    <script src="catalogo-simple.js?v=5"></script>
</body>
</html>
