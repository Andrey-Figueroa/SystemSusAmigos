<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sus Amigos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="../css/theme.css?v=2">
    <link rel="stylesheet" href="style.css?v=9">
    <!-- Si hay una sesión guardada, mostrar el skeleton mientras se verifica (evita ver el formulario un instante) -->
    <script>
        try {
            if (Object.keys(localStorage).some(function (k) { return /^sb-.+-auth-token$/.test(k); })) {
                document.documentElement.classList.add('auth-checking');
            }
        } catch (e) {}
    </script>
</head>
<body>
    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <main class="login-wrapper">
        <div class="login-card">
            <!-- Panel de marca -->
            <section class="brand-panel">
                <div class="brand-content">
                    <h1 class="sr-only">Sus Amigos - Centro de Servicios</h1>
                    <img src="../SusAmigosLogotipo.webp" alt="Sus Amigos - Centro de Servicios" class="brand-logo" width="450" height="300">
                </div>
            </section>

            <!-- Panel del formulario -->
            <section class="form-panel">
                <!-- Skeleton: visible solo mientras se verifica una sesión guardada -->
                <div class="login-skeleton" role="status" aria-label="Verificando sesión">
                    <div class="sk sk-title"></div>
                    <div class="sk sk-text"></div>
                    <div class="sk sk-label"></div>
                    <div class="sk sk-input"></div>
                    <div class="sk sk-label"></div>
                    <div class="sk sk-input"></div>
                    <div class="sk sk-button"></div>
                </div>

                <div class="form-header">
                    <h2>Iniciar sesión</h2>
                    <p>Ingresa con tu cuenta de personal.</p>
                </div>

                <form id="login-form" class="login-form" novalidate>
                    <div class="input-group">
                        <label for="email">Correo electrónico</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password" aria-describedby="caps-warning">
                            <i class="fa-solid fa-eye-slash toggle-password" id="toggle-password" title="Mostrar u ocultar contraseña"></i>
                        </div>
                        <p class="caps-warning" id="caps-warning" aria-live="polite"></p>
                    </div>

                    <label class="remember-me" for="remember-me">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <span>Recordarme en este dispositivo</span>
                    </label>

                    <button type="submit" class="btn-login" id="btn-login">
                        <span>Ingresar</span>
                        <i class="fa-solid fa-arrow-right button-icon"></i>
                    </button>
                </form>

                <footer class="login-footer">
                    <p>&copy; <span id="footer-year">2026</span> Sus Amigos. Todos los derechos reservados.</p>
                </footer>
            </section>
        </div>
    </main>

    <!-- Supabase SDK via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Client Configuration -->
    <script src="../js/config.js?v=13"></script>
    <script src="../js/supabase.js"></script>
    <!-- Application Script -->
    <script src="app.js?v=5"></script>
</body>
</html>
