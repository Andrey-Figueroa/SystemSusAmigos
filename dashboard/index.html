<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sus Amigos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos (también los usa personal/index.html) -->
    <link rel="stylesheet" href="style.css?v=14">
    <!-- Configuración, layout compartido y verificación de sesión -->
    <script src="../js/config.js?v=13"></script>
    <script src="../js/layout.js?v=18"></script>
    <script src="../js/auth_guard.js?v=10"></script>
</head>
<body>
    <div class="dashboard-layout">
        <main class="dashboard-content" id="dashboard-content">
            <h1 class="dash-title">Dashboard</h1>

            <!-- Indicadores -->
            <section class="dash-indicadores" id="dash-indicadores" aria-labelledby="dash-indicadores-titulo">
                <h2 class="dash-section-heading" id="dash-indicadores-titulo">Indicadores</h2>

                <div class="dash-kpis">
                    <article class="dash-kpi is-loading" id="kpi-ticket-promedio" aria-live="polite">
                        <div class="dash-kpi-head">
                            <span class="dash-kpi-icon" aria-hidden="true"><i class="fa-solid fa-receipt"></i></span>
                            <h3 class="dash-kpi-label">Ticket promedio</h3>
                        </div>
                        <p class="dash-kpi-value" id="kpi-ticket-valor">₡0</p>
                        <p class="dash-kpi-detail" id="kpi-ticket-detalle">Calculando…</p>
                    </article>

                    <article class="dash-kpi" id="kpi-caja-inicial">
                        <div class="dash-kpi-head">
                            <span class="dash-kpi-icon" aria-hidden="true"><i class="fa-solid fa-cash-register"></i></span>
                            <h3 class="dash-kpi-label"><label for="input-caja-inicial">Caja inicial</label></h3>
                        </div>
                        <div class="dash-caja-row">
                            <div class="dash-caja-input">
                                <span class="dash-caja-prefix" aria-hidden="true">₡</span>
                                <input type="number" id="input-caja-inicial" value="40000" min="0" step="1000" inputmode="numeric">
                            </div>
                            <button type="button" class="dash-caja-btn" id="btn-update-caja" title="Notificar cambio de caja" aria-label="Notificar cambio de caja">
                                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                            </button>
                        </div>
                        <p class="dash-kpi-detail" id="kpi-caja-estado" aria-live="polite">Cambia el monto y presiona enviar para notificar.</p>
                    </article>

                    <article class="dash-kpi dash-kpi-highlight is-loading" id="kpi-dinero-caja" aria-live="polite">
                        <div class="dash-kpi-head">
                            <span class="dash-kpi-icon" aria-hidden="true"><i class="fa-solid fa-sack-dollar"></i></span>
                            <h3 class="dash-kpi-label">Dinero en caja</h3>
                        </div>
                        <p class="dash-kpi-value" id="kpi-dinero-valor">₡0</p>
                        <p class="dash-kpi-detail" id="kpi-dinero-detalle">Calculando…</p>
                    </article>

                    <article class="dash-kpi is-loading" id="kpi-gastos" aria-live="polite">
                        <div class="dash-kpi-head">
                            <span class="dash-kpi-icon dash-kpi-icon-red" aria-hidden="true"><i class="fa-solid fa-money-bill-transfer"></i></span>
                            <h3 class="dash-kpi-label">Gastos en efectivo</h3>
                        </div>
                        <p class="dash-kpi-value dash-value-red" id="kpi-gastos-valor">₡0</p>
                        <p class="dash-kpi-detail" id="kpi-gastos-detalle">Calculando…</p>
                    </article>

                    <article class="dash-kpi dash-kpi-wide is-loading" id="kpi-cierre" aria-live="polite">
                        <div class="dash-kpi-head">
                            <span class="dash-kpi-icon" aria-hidden="true"><i class="fa-solid fa-vault"></i></span>
                            <h3 class="dash-kpi-label">Dinero entregado al cierre</h3>
                        </div>
                        <div class="dash-kpi-wide-body">
                            <p class="dash-kpi-value" id="kpi-cierre-valor">₡0</p>
                            <p class="dash-kpi-detail" id="kpi-cierre-detalle">Calculando…</p>
                        </div>
                    </article>
                </div>
            </section>

            <!-- Desglose de ventas por categoría (las tablas las dibuja app.js) -->
            <section class="dash-desglose" id="dash-desglose" aria-labelledby="dash-desglose-titulo">
                <h2 class="dash-section-heading dash-heading-gold" id="dash-desglose-titulo">Desglose de ventas por categoría</h2>

                <div class="dash-desglose-grid">
                    <div class="dash-desglose-col">
                        <div id="tabla-lubricentro"></div>
                        <div id="tabla-global"></div>
                        <div id="tabla-totales"></div>
                    </div>
                    <div class="dash-desglose-col">
                        <div id="tabla-productos"></div>
                        <div id="tabla-domicilio"></div>
                        <div id="tabla-abonos"></div>
                    </div>
                </div>
            </section>

            <!-- Aquí se irán agregando los demás componentes del nuevo dashboard -->
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Client Configuration -->
    <script src="../js/supabase.js"></script>
    <!-- Application Script -->
    <script src="app.js?v=20"></script>
</body>
</html>
